<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天气预览</title>
  <link rel="stylesheet" href="weather-widget.css" />
  <style>html, body { margin: 0; height: 100%; background: #0d1117; }</style>
</head>
<body>
  <!-- 阻止组件自带的自动挂载（避免重复实例） -->
  <script>window.__ww_noauto = true;</script>
  <script src="weather-widget.js"></script>
  <script>
    var BASE = location.pathname.indexOf("/rl93w/") === 0 ? "/rl93w" : "";
    var loc = new URLSearchParams(location.search).get("loc") || "";
    WeatherWidget.mount({ location: loc, settingsApi: BASE + "/api/settings", embed: true });
  </script>
</body>
</html>
