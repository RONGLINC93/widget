<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日历预览</title>
  <link rel="stylesheet" href="calendar-widget.css" />
  <style>html, body { margin: 0; height: 100%; background: #0d1117; }</style>
</head>
<body>
  <!-- 阻止组件自带的 DOMContentLoaded 自动挂载（避免重复实例） -->
  <script>window.__cw_noauto = true;</script>
  <script src="calendar-widget.js"></script>
  <script>
    var BASE = location.pathname.indexOf("/rl93w/") === 0 ? "/rl93w" : "";
    fetch(BASE + "/api/settings", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var notes = (j.settings && j.settings.notes) || {};
        CalendarWidget.mount({ notes: notes, settingsApi: BASE + "/api/settings", embed: true });
      })
      .catch(function () { CalendarWidget.mount({ embed: true }); });
  </script>
</body>
</html>
