<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>目录浏览器预览</title>
  <link rel="stylesheet" href="dir-widget.css" />
  <style>html, body { margin: 0; height: 100%; background: #0d1117; }</style>
</head>
<body>
  <script>
    var BASE = location.pathname.indexOf("/rl93w/") === 0 ? "/rl93w" : "";
    var p = new URLSearchParams(location.search);
    if (window.DirWidget) start();
    function start() {
      DirWidget.mount({
        path: p.get("dir") || "",
        root: p.get("root") || "",
        api: BASE + "/api/list",
        fileApi: BASE + "/api/file",
        searchApi: BASE + "/api/search",
        settingsApi: null,   // 预览不回写服务端设置
        embed: true
      });
    }
  </script>
  <script src="dir-widget.js"></script>
  <script>start();</script>
</body>
</html>
