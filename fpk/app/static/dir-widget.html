<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>目录文件列表组件 · 演示</title>
  <link rel="stylesheet" href="dir-widget.css" />
  <style>
    body { margin: 0; min-height: 100vh;
      background: radial-gradient(1200px 600px at 70% -10%, #1f6feb33, transparent), #0d1117;
      color: #8b949e; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .hint { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    .hint code { background: #161b22; padding: 2px 6px; border-radius: 4px; color: #e6edf3; }
    .btn-primary { background: #238636; color: #fff; border: 1px solid #2ea04366;
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
      font-weight: 600; font-family: inherit; }
    .btn-primary:hover:not(:disabled) { background: #2ea043; }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .inject-msg { margin-left: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="hint">
    <h2>目录文件列表浮层组件</h2>
    <p>右上角浮层即为组件。在路径框输入任意目录（如 <code>/</code> 或 <code>C:\</code>），
       回车即可列出其文件，点击文件夹可进入，↑ 返回上级。</p>
    <p>接口：<code>GET /api/list?path=目录路径</code> 返回 JSON 文件列表。</p>
    <p>
      <button id="injectBtn" class="btn-primary">应用到桌面（注入显示）</button>
      <span id="injectMsg" class="inject-msg"></span>
    </p>
  </div>

  <!-- 演示：默认打开当前工作目录；也可改为任意路径 -->
  <script src="dir-widget.js"></script>
  <script>
    // 本页可能从根路径(/static/dir-widget.html)或经 nginx 反代
    // (/rl93w/static/dir-widget.html)加载，两种场景下 API 前缀不同，需自适应。
    var BASE = location.pathname.indexOf("/rl93w/") === 0 ? "/rl93w" : "";

    DirWidget.mount({
      path: decodeURIComponent(new URLSearchParams(location.search).get("path") || "."),
      api: BASE + "/api/list"
    });

    var injectBtn = document.getElementById("injectBtn");
    var injectMsg = document.getElementById("injectMsg");
    injectBtn.addEventListener("click", function () {
      injectBtn.disabled = true;
      injectMsg.textContent = "正在注入桌面…（会写 ng.conf.zip 并重启 nginx，请稍候）";
      fetch(BASE + "/api/inject", { method: "POST" })
        .then(function (r) {
          return r.json().catch(function () {
            return { status: "error", message: "HTTP " + r.status };
          });
        })
        .then(function (j) {
          if (j.status === "success") {
            injectMsg.textContent = "✅ 已注入桌面，刷新桌面即可看到浮层（" + (j.message || "") + "）";
          } else {
            injectMsg.textContent = "⚠ 注入失败：" + (j.message || j.status);
          }
        })
        .catch(function (e) {
          injectMsg.textContent = "❌ 请求失败：" + e.message;
        })
        .then(function () { injectBtn.disabled = false; });
    });
  </script>
</body>
</html>
